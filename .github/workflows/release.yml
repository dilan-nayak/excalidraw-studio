name: Release

# Push a tag like v0.8.0 (it must match "version" in src-tauri/tauri.conf.json)
# and this builds the Windows installer and attaches it to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches tauri.conf.json version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Excalidraw Studio ${{ github.ref_name }}" \
            --notes "Download **Excalidraw Studio_*_x64-setup.exe**, run it, and follow the README: https://github.com/${{ github.repository }}#readme" \
            src-tauri/target/release/bundle/nsis/*-setup.exe
